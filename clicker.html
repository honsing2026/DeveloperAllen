<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click This Red Button</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #e2e8f0;
    user-select: none;
  }
  h1 { margin: 0 0 8px; font-size: 1.6rem; }
  .score { font-size: 2.4rem; font-weight: 700; margin-bottom: 4px; }
  .stats { font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; }
  .level-bar {
    width: min(420px, 92vw);
    margin-bottom: 20px;
  }
  .level-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .level-info .lvl { color: #38bdf8; font-weight: 700; }
  .level-track {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: #334155;
    overflow: hidden;
  }
  .level-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    transition: width 0.2s ease-out;
  }
  #clickBtn {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: none;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c);
    box-shadow: 0 8px 0 #7f1d1d, 0 12px 24px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 0.05s, box-shadow 0.05s;
  }
  #clickBtn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #7f1d1d, 0 4px 12px rgba(0,0,0,0.4);
  }
  #clickBtn.golden {
    background: radial-gradient(circle at 30% 30%, #fde047, #ca8a04);
    box-shadow: 0 8px 0 #854d0e, 0 0 40px 10px rgba(253, 224, 71, 0.7);
  }
  .float-golden {
    position: fixed;
    pointer-events: none;
    font-weight: 700;
    font-size: 1.4rem;
    color: #fde047;
    text-shadow: 0 0 8px rgba(253, 224, 71, 0.9);
    animation: floatUp 1s ease-out forwards;
    z-index: 100;
  }
  .float-normal {
    position: fixed;
    pointer-events: none;
    font-weight: 700;
    font-size: 1rem;
    color: #e2e8f0;
    animation: floatUp 0.8s ease-out forwards;
    z-index: 100;
  }
  .score.bump {
    animation: scoreBump 0.15s ease-out;
  }
  .combo {
    font-size: 0.8rem;
    font-weight: 700;
    color: #f97316;
    height: 1.2em;
    margin-bottom: 4px;
    transition: opacity 0.2s;
  }
  .combo.hidden { opacity: 0; }
  .next-hint {
    font-size: 0.75rem;
    color: #64748b;
    margin-bottom: 12px;
    min-height: 1em;
  }
  .toast-container {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 200;
    pointer-events: none;
  }
  .toast {
    padding: 10px 16px;
    border-radius: 10px;
    background: #1e293b;
    border: 1px solid #fbbf24;
    color: #fbbf24;
    font-weight: 700;
    font-size: 0.85rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s forwards;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateX(40px); }
  }
  .item.affordable {
    border-color: #22c55e;
    box-shadow: 0 0 12px rgba(34,197,94,0.25);
  }
  @keyframes scoreBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .item .buy-max {
    background: #0ea5e9;
    color: #082f49;
    margin-left: 6px;
  }
  .item .buy-max:disabled {
    background: #334155;
    color: #64748b;
  }
  .item .btns { display: flex; flex-direction: column; gap: 4px; }
  @keyframes floatUp {
    from { opacity: 1; transform: translate(-50%, 0); }
    to { opacity: 0; transform: translate(-50%, -80px); }
  }
  .shop {
    margin-top: 28px;
    width: min(420px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 10px;
    background: #1e293b;
    border: 1px solid #334155;
  }
  .item .info { text-align: left; }
  .item .name { font-weight: 600; }
  .item .desc { font-size: 0.75rem; color: #94a3b8; }
  .item button {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: #22c55e;
    color: #052e16;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .item button:disabled {
    background: #334155;
    color: #64748b;
    cursor: not-allowed;
  }
  .reset {
    margin-top: 20px;
    background: none;
    border: 1px solid #475569;
    color: #94a3b8;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.75rem;
  }
  .layout {
    position: relative;
    display: flex;
    justify-content: center;
    width: 100%;
  }
  .main-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .rebirth-panel {
    position: absolute;
    top: 0;
    left: calc(50% + 260px);
    width: 220px;
    padding: 16px;
    border-radius: 12px;
    background: #1e293b;
    border: 1px solid #334155;
    text-align: center;
  }
  .switch-panel {
    position: absolute;
    top: 0;
    right: calc(50% + 260px);
    width: 220px;
    padding: 16px;
    border-radius: 12px;
    background: #1e293b;
    border: 1px solid #334155;
    text-align: center;
  }
  .switch-panel h2 {
    margin: 0 0 8px;
    font-size: 1rem;
    color: #a78bfa;
  }
  .switch-panel .sw-req {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  #switchBtn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #a78bfa;
    color: #2e1065;
    font-weight: 700;
    cursor: pointer;
  }
  #switchBtn:disabled {
    background: #334155;
    color: #64748b;
    cursor: not-allowed;
  }
  .load-bar {
    width: 100%;
    height: 14px;
    border-radius: 7px;
    background: #334155;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .load-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #a78bfa, #c4b5fd);
    transition: width 0.1s linear;
  }
  .sw-status {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 10px;
    min-height: 1em;
  }
  #switchPage {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    padding: 24px;
  }
  #switchPage.active { display: flex; }
  #homePage.hidden { display: none; }
  .switch-card {
    width: min(420px, 92vw);
    padding: 24px;
    border-radius: 12px;
    background: #1e293b;
    border: 1px solid #334155;
    text-align: center;
  }
  .switch-card h2 {
    margin: 0 0 16px;
    font-size: 1.3rem;
    color: #a78bfa;
  }
  .gacha-cost {
    font-size: 0.8rem;
    color: #94a3b8;
    margin-bottom: 12px;
  }
  .gacha-cost strong { color: #fbbf24; }
  .rarity-Common { color: #94a3b8; }
  .rarity-Rare { color: #38bdf8; }
  .rarity-Epic { color: #c084fc; }
  .rarity-Legendary { color: #fbbf24; text-shadow: 0 0 8px rgba(251,191,36,0.6); }
  .rarity-Mythic { color: #f472b6; text-shadow: 0 0 12px rgba(244,114,182,0.9); font-weight: 700; }
  .gacha-result {
    min-height: 3.2em;
    margin: 12px 0;
    font-size: 0.95rem;
    line-height: 1.4;
  }
  .gacha-result .big { font-size: 1.2rem; font-weight: 700; }
  .pity {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 12px;
  }
  .luck-box {
    margin: 12px 0;
    padding: 12px;
    border-radius: 10px;
    background: #0f172a;
    border: 1px solid #334155;
  }
  .luck-box .luck-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #f472b6;
    margin-bottom: 4px;
  }
  .luck-box .luck-desc {
    font-size: 0.7rem;
    color: #94a3b8;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  #luckBtn {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: none;
    background: #f472b6;
    color: #500724;
    font-weight: 700;
    cursor: pointer;
  }
  #luckBtn:disabled {
    background: #334155;
    color: #64748b;
    cursor: not-allowed;
  }
  .history {
    margin-top: 16px;
    max-height: 140px;
    overflow-y: auto;
    text-align: left;
    font-size: 0.75rem;
    border-top: 1px solid #334155;
    padding-top: 10px;
  }
  .history div { padding: 2px 0; }
  .history .empty { color: #64748b; font-style: italic; }
  #switchLoadBtn:disabled {
    background: #334155;
    color: #64748b;
    cursor: not-allowed;
  }
  #backBtn {
    margin-top: 20px;
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: none;
    color: #e2e8f0;
    font-weight: 700;
    cursor: pointer;
  }
  .rebirth-panel h2 {
    margin: 0 0 8px;
    font-size: 1rem;
    color: #fbbf24;
  }
  .rebirth-panel .rb-count {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .rebirth-panel .rb-mult {
    font-size: 0.8rem;
    color: #94a3b8;
    margin-bottom: 12px;
  }
  .rebirth-panel .rb-req {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  #rebirthBtn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #fbbf24;
    color: #451a03;
    font-weight: 700;
    cursor: pointer;
  }
  #rebirthBtn:disabled {
    background: #334155;
    color: #64748b;
    cursor: not-allowed;
  }
  @media (max-width: 900px) {
    .rebirth-panel,
    .switch-panel {
      position: static;
      width: min(420px, 92vw);
      margin-top: 24px;
    }
    .layout { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>
  <div id="homePage">
  <h1>Click This Red Button</h1>
  <div class="layout">
    <div class="main-col">
      <div class="score" id="score">0</div>
      <div class="stats" id="stats">0 per click &middot; 0 per second</div>
      <div class="combo hidden" id="combo"></div>
      <div class="next-hint" id="nextHint"></div>

      <div class="level-bar">
        <div class="level-info">
          <span class="lvl" id="levelText">Level 1</span>
          <span id="xpText">0 / 0 XP</span>
        </div>
        <div class="level-track"><div class="level-fill" id="levelFill"></div></div>
      </div>

      <button id="clickBtn">CLICK</button>

      <div class="shop" id="shop"></div>

      <button class="reset" id="resetBtn">Reset game</button>
    </div>

    <div class="rebirth-panel">
      <h2>Rebirth</h2>
      <div class="rb-count" id="rbCount">0</div>
      <div class="rb-mult" id="rbMult">x1.00 income</div>
      <div class="rb-req" id="rbReq"></div>
      <button id="rebirthBtn" disabled>Rebirth</button>
    </div>

    <div class="switch-panel">
      <h2>Clicker Gacha</h2>
      <div class="sw-req" id="swReq"></div>
      <button id="switchBtn" disabled>Clicker Gacha</button>
    </div>
  </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <div id="switchPage">
    <div class="switch-card">
      <h2>Clicker Gacha</h2>
      <div class="gacha-cost">Cost per roll: <strong id="gachaCost">0</strong></div>
      <div class="load-bar"><div class="load-bar-fill" id="loadFill"></div></div>
      <div class="gacha-result" id="gachaResult"></div>
      <div class="pity" id="pityText"></div>
      <div class="luck-box">
        <div class="luck-title" id="luckTitle">Gacha Luck: Lv 0</div>
        <div class="luck-desc" id="luckDesc"></div>
        <button id="luckBtn">Upgrade Luck</button>
      </div>
      <button id="switchLoadBtn">Roll Gacha</button>
      <button id="roll10Btn">Roll 10x</button>
      <br>
      <button id="backBtn">Back to Home</button>
      <div class="history" id="history"></div>
    </div>
  </div>

<script>
  const SAVE_KEY = "clickerGameSave";

  const upgrades = [
    { id: "click1", name: "Better Finger", desc: "+1 per click", baseCost: 10, type: "click", value: 1 },
    { id: "auto1", name: "Auto Clicker", desc: "+1 per second", baseCost: 50, type: "auto", value: 1 },
    { id: "click2", name: "Steel Gloves", desc: "+5 per click", baseCost: 100, type: "click", value: 5 },
    { id: "auto2", name: "Clicker Bot", desc: "+5 per second", baseCost: 500, type: "auto", value: 5 },
    { id: "click3", name: "Power Gauntlet", desc: "+25 per click", baseCost: 1000, type: "click", value: 25 },
    { id: "auto3", name: "Clicker Factory", desc: "+25 per second", baseCost: 5000, type: "auto", value: 25 },
    { id: "click4", name: "Titanium Fist", desc: "+100 per click", baseCost: 10000, type: "click", value: 100 },
    { id: "auto4", name: "Clicker Mine", desc: "+100 per second", baseCost: 50000, type: "auto", value: 100 },
    { id: "click5", name: "Laser Pointer", desc: "+500 per click", baseCost: 100000, type: "click", value: 500 },
    { id: "auto5", name: "Clicker Lab", desc: "+500 per second", baseCost: 500000, type: "auto", value: 500 },
    { id: "click6", name: "Plasma Glove", desc: "+2,500 per click", baseCost: 1000000, type: "click", value: 2500 },
    { id: "auto6", name: "Clicker Reactor", desc: "+2,500 per second", baseCost: 5000000, type: "auto", value: 2500 },
    { id: "click7", name: "Quantum Finger", desc: "+10,000 per click", baseCost: 10000000, type: "click", value: 10000 },
    { id: "auto7", name: "Clicker Satellite", desc: "+10,000 per second", baseCost: 50000000, type: "auto", value: 10000 },
    { id: "click8", name: "Nano Swarm", desc: "+50,000 per click", baseCost: 100000000, type: "click", value: 50000 },
    { id: "auto8", name: "Clicker Datacenter", desc: "+50,000 per second", baseCost: 500000000, type: "auto", value: 50000 },
    { id: "click9", name: "Antimatter Tap", desc: "+250,000 per click", baseCost: 1000000000, type: "click", value: 250000 },
    { id: "auto9", name: "Clicker Dyson Sphere", desc: "+250,000 per second", baseCost: 5000000000, type: "auto", value: 250000 },
    { id: "click10", name: "Black Hole Fist", desc: "+1,000,000 per click", baseCost: 10000000000, type: "click", value: 1000000 },
    { id: "auto10", name: "Clicker Galaxy", desc: "+1,000,000 per second", baseCost: 50000000000, type: "auto", value: 1000000 },
    { id: "click11", name: "Cosmic Gauntlet", desc: "+5,000,000 per click", baseCost: 100000000000, type: "click", value: 5000000 },
    { id: "auto11", name: "Clicker Universe", desc: "+5,000,000 per second", baseCost: 500000000000, type: "auto", value: 5000000 },
    { id: "click12", name: "Reality Bender", desc: "+25,000,000 per click", baseCost: 1000000000000, type: "click", value: 25000000 },
    { id: "auto12", name: "Clicker Multiverse", desc: "+25,000,000 per second", baseCost: 5000000000000, type: "auto", value: 25000000 },
    { id: "click13", name: "Time Fracture", desc: "+100,000,000 per click", baseCost: 10000000000000, type: "click", value: 100000000 },
    { id: "auto13", name: "Clicker Omniverse", desc: "+100,000,000 per second", baseCost: 50000000000000, type: "auto", value: 100000000 },
    { id: "click14", name: "God Finger", desc: "+500,000,000 per click", baseCost: 100000000000000, type: "click", value: 500000000 },
    { id: "auto14", name: "Clicker Singularity", desc: "+500,000,000 per second", baseCost: 500000000000000, type: "auto", value: 500000000 },
    { id: "click15", name: "Infinity Touch", desc: "+2,500,000,000 per click", baseCost: 1000000000000000, type: "click", value: 2500000000 },
    { id: "auto15", name: "Clicker Eternity", desc: "+2,500,000,000 per second", baseCost: 5000000000000000, type: "auto", value: 2500000000 },
    { id: "click16", name: "Void Fist", desc: "+10,000,000,000 per click", baseCost: 10000000000000000, type: "click", value: 10000000000 },
    { id: "auto16", name: "Clicker Beyond", desc: "+10,000,000,000 per second", baseCost: 50000000000000000, type: "auto", value: 10000000000 },
    { id: "click17", name: "Stellar Knuckle", desc: "+50,000,000,000 per click", baseCost: 100000000000000000, type: "click", value: 50000000000 },
    { id: "auto17", name: "Clicker Ascension", desc: "+50,000,000,000 per second", baseCost: 500000000000000000, type: "auto", value: 50000000000 },
    { id: "click18", name: "Dimension Crusher", desc: "+250,000,000,000 per click", baseCost: 1000000000000000000, type: "click", value: 250000000000 },
    { id: "auto18", name: "Clicker Transcendence", desc: "+250,000,000,000 per second", baseCost: 5000000000000000000, type: "auto", value: 250000000000 },
    { id: "click19", name: "Eternal Palm", desc: "+1,000,000,000,000 per click", baseCost: 10000000000000000000, type: "click", value: 1000000000000 },
    { id: "auto19", name: "Clicker Apotheosis", desc: "+1,000,000,000,000 per second", baseCost: 50000000000000000000, type: "auto", value: 1000000000000 },
    { id: "click20", name: "Omni Touch", desc: "+5,000,000,000,000 per click", baseCost: 100000000000000000000, type: "click", value: 5000000000000 },
    { id: "auto20", name: "Clicker Infinity", desc: "+5,000,000,000,000 per second", baseCost: 500000000000000000000, type: "auto", value: 5000000000000 },
  ];

  let state = {
    score: 0,
    totalClicks: 0,
    owned: {}, // id -> count
    rebirths: 0,
    pity: 0, // rolls since last Legendary
    mythicPity: 0, // rolls since last Mythic
    history: [], // recent gacha results
    level: 1,
    xp: 0,
    luck: 0, // gacha luck level
    achievements: {}, // id -> true
    milestones: {}, // threshold -> true
  };

  // Combo tracking (not persisted; resets on reload)
  let combo = 0;
  let lastClickTime = 0;
  const COMBO_WINDOW_MS = 800;
  const COMBO_MAX = 50;

  // Index of "Clicker Factory" (auto3) in the upgrades list.
  const REBIRTH_BASE_INDEX = upgrades.findIndex((u) => u.id === "auto3");

  // Number of upgrades that must be owned to perform the next rebirth.
  // First rebirth: through Clicker Factory. Each subsequent: +5 upgrades.
  function rebirthRequirement() {
    return REBIRTH_BASE_INDEX + 1 + state.rebirths * 5;
  }

  function rebirthMultiplier() {
    return 1 + state.rebirths * 0.5;
  }

  // Level system: each level grants +10% income.
  function levelMultiplier() {
    return 1 + (state.level - 1) * 0.1;
  }

  // XP needed to reach the next level from the current one.
  function xpForNextLevel() {
    return Math.floor(50 * Math.pow(1.25, state.level - 1));
  }

  function addXp(amount) {
    state.xp += amount;
    let leveled = false;
    while (state.xp >= xpForNextLevel()) {
      state.xp -= xpForNextLevel();
      state.level += 1;
      leveled = true;
    }
    return leveled;
  }

  function canRebirth() {
    const req = rebirthRequirement();
    if (req > upgrades.length) return false;
    for (let i = 0; i < req; i++) {
      if (!(state.owned[upgrades[i].id] > 0)) return false;
    }
    return true;
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state.score = parsed.score || 0;
        state.totalClicks = parsed.totalClicks || 0;
        state.owned = parsed.owned || {};
        state.rebirths = parsed.rebirths || 0;
        state.pity = parsed.pity || 0;
        state.mythicPity = parsed.mythicPity || 0;
        state.history = parsed.history || [];
        state.level = parsed.level || 1;
        state.xp = parsed.xp || 0;
        state.luck = parsed.luck || 0;
        state.achievements = parsed.achievements || {};
        state.milestones = parsed.milestones || {};
      }
    } catch (e) {
      console.warn("Could not load save", e);
    }
  }

  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("Could not save", e);
    }
  }

  function costOf(upgrade) {
    const count = state.owned[upgrade.id] || 0;
    return Math.floor(upgrade.baseCost * Math.pow(1.15, count));
  }

  function perClick() {
    let v = 1;
    for (const u of upgrades) {
      if (u.type === "click") v += u.value * (state.owned[u.id] || 0);
    }
    return v * rebirthMultiplier() * levelMultiplier();
  }

  function perSecond() {
    let v = 0;
    for (const u of upgrades) {
      if (u.type === "auto") v += u.value * (state.owned[u.id] || 0);
    }
    return v * rebirthMultiplier() * levelMultiplier();
  }

  function format(n) {
    if (n < 1000) return Math.floor(n).toString();
    const units = ["K", "M", "B", "T", "Qa", "Qi"];
    let i = -1;
    while (n >= 1000 && i < units.length - 1) {
      n /= 1000;
      i++;
    }
    return n.toFixed(2) + units[i];
  }

  const scoreEl = document.getElementById("score");
  const statsEl = document.getElementById("stats");
  const shopEl = document.getElementById("shop");
  const clickBtn = document.getElementById("clickBtn");
  const resetBtn = document.getElementById("resetBtn");
  const rbCountEl = document.getElementById("rbCount");
  const rbMultEl = document.getElementById("rbMult");
  const rbReqEl = document.getElementById("rbReq");
  const rebirthBtn = document.getElementById("rebirthBtn");
  const swReqEl = document.getElementById("swReq");
  const switchBtn = document.getElementById("switchBtn");
  const loadFillEl = document.getElementById("loadFill");
  const swStatusEl = document.getElementById("swStatus");
  const homePageEl = document.getElementById("homePage");
  const switchPageEl = document.getElementById("switchPage");
  const switchLoadBtn = document.getElementById("switchLoadBtn");
  const roll10Btn = document.getElementById("roll10Btn");
  const backBtn = document.getElementById("backBtn");
  const gachaCostEl = document.getElementById("gachaCost");
  const gachaResultEl = document.getElementById("gachaResult");
  const pityTextEl = document.getElementById("pityText");
  const historyEl = document.getElementById("history");
  const levelTextEl = document.getElementById("levelText");
  const xpTextEl = document.getElementById("xpText");
  const levelFillEl = document.getElementById("levelFill");
  const luckTitleEl = document.getElementById("luckTitle");
  const luckDescEl = document.getElementById("luckDesc");
  const luckBtn = document.getElementById("luckBtn");
  const comboEl = document.getElementById("combo");
  const nextHintEl = document.getElementById("nextHint");
  const toastContainerEl = document.getElementById("toastContainer");

  const SWITCH_REQUIRED_REBIRTHS = 10;
  const SWITCH_LOAD_MS = 5000;
  let switchLoading = false;
  let switchProgress = 0;
  let switchTimer = null;

  // Gacha configuration
  const GACHA_MIN_COST = 1000;
  const GACHA_SCORE_FRACTION = 0.1; // cost is 10% of current score
  const PITY_THRESHOLD = 20; // guaranteed Legendary after this many non-Legendary rolls
  const MYTHIC_PITY_THRESHOLD = 50; // guaranteed Mythic after this many non-Mythic rolls
  const RARITIES = [
    { name: "Common", weight: 60, copies: 1 },
    { name: "Rare", weight: 25, copies: 3 },
    { name: "Epic", weight: 12, copies: 10 },
    { name: "Legendary", weight: 2.9, copies: 50 },
    { name: "Mythic", weight: 0.1, copies: 250 },
  ];

  // Luck shifts weight from Common toward the rarer tiers.
  // Each luck level moves 3 weight points from Common into the rare tiers.
  const LUCK_SHIFT_PER_LEVEL = 3;
  const LUCK_MAX_LEVEL = 20;

  function luckCost() {
    return Math.floor(5000 * Math.pow(2, state.luck));
  }

  // Returns rarity weights adjusted for the current luck level.
  function adjustedWeights() {
    const weights = RARITIES.map((r) => r.weight);
    let shift = Math.min(state.luck * LUCK_SHIFT_PER_LEVEL, weights[0] - 1);
    weights[0] -= shift;
    // Distribute the shifted weight across the rarer tiers, favoring the top.
    const distribution = [0.1, 0.25, 0.35, 0.3]; // Rare, Epic, Legendary, Mythic
    for (let i = 0; i < distribution.length; i++) {
      weights[i + 1] += shift * distribution[i];
    }
    return weights;
  }

  function rollRarity() {
    // Mythic pity takes priority over Legendary pity.
    if (state.mythicPity >= MYTHIC_PITY_THRESHOLD - 1) return RARITIES[4];
    if (state.pity >= PITY_THRESHOLD - 1) return RARITIES[3];
    const weights = adjustedWeights();
    const total = weights.reduce((s, w) => s + w, 0);
    let roll = Math.random() * total;
    for (let i = 0; i < RARITIES.length; i++) {
      roll -= weights[i];
      if (roll <= 0) return RARITIES[i];
    }
    return RARITIES[0];
  }

  // Gacha cost scales with current score, with a minimum floor.
  function gachaCost() {
    return Math.max(GACHA_MIN_COST, Math.floor(state.score * GACHA_SCORE_FRACTION));
  }

  function renderGacha() {
    const cost = gachaCost();
    gachaCostEl.textContent = format(cost);
    pityTextEl.textContent =
      "Legendary pity: " + state.pity + "/" + PITY_THRESHOLD +
      " \u00b7 Mythic pity: " + state.mythicPity + "/" + MYTHIC_PITY_THRESHOLD;

    if (state.history.length === 0) {
      historyEl.innerHTML = '<div class="empty">No rolls yet.</div>';
    } else {
      historyEl.innerHTML = state.history
        .map(
          (h) =>
            '<div class="rarity-' + h.rarity + '">' +
            h.rarity + " \u2014 " + h.name + " x" + h.copies +
            "</div>"
        )
        .join("");
    }

    const canAfford = state.score >= cost;
    switchLoadBtn.disabled = switchLoading || !canAfford;
    switchLoadBtn.textContent = switchLoading
      ? "Rolling..."
      : canAfford
      ? "Roll Gacha"
      : "Need " + format(cost) + " score";

    const canAfford10 = state.score >= cost * 10;
    roll10Btn.disabled = switchLoading || !canAfford10;
    roll10Btn.textContent = canAfford10
      ? "Roll 10x (" + format(cost * 10) + ")"
      : "Need " + format(cost * 10);

    // Luck upgrade UI
    luckTitleEl.textContent = "Gacha Luck: Lv " + state.luck;
    if (state.luck >= LUCK_MAX_LEVEL) {
      luckDescEl.textContent = "Max luck reached! Best odds unlocked.";
      luckBtn.textContent = "Maxed";
      luckBtn.disabled = true;
    } else {
      const w = adjustedWeights();
      const total = w.reduce((s, x) => s + x, 0);
      const mythicPct = ((w[4] / total) * 100).toFixed(2);
      const legendaryPct = ((w[3] / total) * 100).toFixed(2);
      luckDescEl.textContent =
        "Mythic: " + mythicPct + "% \u00b7 Legendary: " + legendaryPct + "%";
      const lc = luckCost();
      luckBtn.textContent = "Upgrade Luck: " + format(lc);
      luckBtn.disabled = state.score < lc;
    }
  }

  function buildShop() {
    shopEl.innerHTML = "";
    for (const u of upgrades) {
      const row = document.createElement("div");
      row.className = "item";

      const info = document.createElement("div");
      info.className = "info";
      const name = document.createElement("div");
      name.className = "name";
      const desc = document.createElement("div");
      desc.className = "desc";
      info.appendChild(name);
      info.appendChild(desc);

      const btns = document.createElement("div");
      btns.className = "btns";

      const btn = document.createElement("button");
      btn.addEventListener("click", () => buy(u));

      const maxBtn = document.createElement("button");
      maxBtn.className = "buy-max";
      maxBtn.addEventListener("click", () => buyMax(u));

      btns.appendChild(btn);
      btns.appendChild(maxBtn);

      row.appendChild(info);
      row.appendChild(btns);
      shopEl.appendChild(row);

      u._els = { name, desc, btn, maxBtn, row };
    }
  }

  function buy(u) {
    const cost = costOf(u);
    if (state.score < cost) return;
    state.score -= cost;
    state.owned[u.id] = (state.owned[u.id] || 0) + 1;
    save();
    render();
  }

  function buyMax(u) {
    let bought = 0;
    while (state.score >= costOf(u)) {
      state.score -= costOf(u);
      state.owned[u.id] = (state.owned[u.id] || 0) + 1;
      bought++;
      if (bought > 10000) break; // safety
    }
    if (bought > 0) {
      save();
      render();
    }
  }

  function render() {
    scoreEl.textContent = format(state.score);
    statsEl.textContent =
      format(perClick()) + " per click \u00b7 " + format(perSecond()) + " per second";

    for (const u of upgrades) {
      const count = state.owned[u.id] || 0;
      const cost = costOf(u);
      const { name, desc, btn, maxBtn, row } = u._els;
      name.textContent = u.name + (count > 0 ? " (x" + count + ")" : "");
      desc.textContent = u.desc;
      btn.textContent = "Buy: " + format(cost);
      btn.disabled = state.score < cost;
      maxBtn.textContent = "Max";
      maxBtn.disabled = state.score < cost;
      row.classList.toggle("affordable", state.score >= cost);
    }

    levelTextEl.textContent = "Level " + state.level;
    xpTextEl.textContent = format(state.xp) + " / " + format(xpForNextLevel()) + " XP";
    levelFillEl.style.width =
      Math.min(100, (state.xp / xpForNextLevel()) * 100).toFixed(1) + "%";

    // Combo display
    if (combo > 1 && Date.now() - lastClickTime < COMBO_WINDOW_MS) {
      comboEl.classList.remove("hidden");
      comboEl.textContent = "COMBO x" + combo + " (+" + (combo * 2) + "%)";
    } else {
      comboEl.classList.add("hidden");
    }

    // Next upgrade hint
    let next = null;
    for (const u of upgrades) {
      if (!(state.owned[u.id] > 0)) { next = u; break; }
    }
    if (next) {
      const c = costOf(next);
      nextHintEl.textContent = "Next: " + next.name + " (" + format(c) + ")";
    } else {
      nextHintEl.textContent = "All upgrades owned!";
    }

    rbCountEl.textContent = state.rebirths;
    rbMultEl.textContent = "x" + rebirthMultiplier().toFixed(2) + " income";

    const req = rebirthRequirement();
    if (req > upgrades.length) {
      rbReqEl.textContent = "Max rebirths reached!";
      rebirthBtn.disabled = true;
    } else {
      const target = upgrades[req - 1];
      rbReqEl.textContent =
        "Own the first " + req + " upgrades (through " + target.name + ")";
      rebirthBtn.disabled = !canRebirth();
    }

    const unlocked = state.rebirths >= SWITCH_REQUIRED_REBIRTHS;
    if (unlocked) {
      swReqEl.textContent = "Unlocked!";
      switchBtn.disabled = false;
    } else {
      const remaining = SWITCH_REQUIRED_REBIRTHS - state.rebirths;
      swReqEl.textContent =
        "Reach " + SWITCH_REQUIRED_REBIRTHS + " rebirths to unlock (" +
        remaining + " to go)";
      switchBtn.disabled = true;
    }

    renderGacha();
  }

  const GOLDEN_CHANCE = 0.01; // 1 in 100
  const GOLDEN_MULTIPLIER = 100;

  // Achievements: unlocked once, grant a small permanent bonus via toast only.
  const ACHIEVEMENTS = [
    { id: "firstClick", name: "First Click!", test: () => state.totalClicks >= 1 },
    { id: "clicks100", name: "100 Clicks!", test: () => state.totalClicks >= 100 },
    { id: "clicks1000", name: "1,000 Clicks!", test: () => state.totalClicks >= 1000 },
    { id: "score1k", name: "1K Score!", test: () => state.score >= 1000 },
    { id: "score1m", name: "1M Score!", test: () => state.score >= 1e6 },
    { id: "score1b", name: "1B Score!", test: () => state.score >= 1e9 },
    { id: "level5", name: "Level 5!", test: () => state.level >= 5 },
    { id: "level10", name: "Level 10!", test: () => state.level >= 10 },
    { id: "firstRebirth", name: "First Rebirth!", test: () => state.rebirths >= 1 },
    { id: "combo25", name: "25x Combo!", test: () => combo >= 25 },
  ];

  // Milestone rewards: score thresholds that grant a one-time bonus.
  const MILESTONES = [
    { threshold: 1000, reward: 500 },
    { threshold: 10000, reward: 5000 },
    { threshold: 100000, reward: 50000 },
    { threshold: 1e6, reward: 500000 },
    { threshold: 1e7, reward: 5e6 },
    { threshold: 1e8, reward: 5e7 },
    { threshold: 1e9, reward: 5e8 },
  ];

  function showToast(text) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = text;
    toastContainerEl.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function checkAchievements() {
    for (const a of ACHIEVEMENTS) {
      if (!state.achievements[a.id] && a.test()) {
        state.achievements[a.id] = true;
        showToast("\uD83C\uDFC6 " + a.name);
      }
    }
  }

  function checkMilestones() {
    for (const m of MILESTONES) {
      if (!state.milestones[m.threshold] && state.score >= m.threshold) {
        state.milestones[m.threshold] = true;
        state.score += m.reward;
        showToast("\uD83C\uDF89 Milestone! +" + format(m.reward));
      }
    }
  }

  function showFloat(amount, x, y, golden) {
    const el = document.createElement("div");
    el.className = golden ? "float-golden" : "float-normal";
    el.textContent = (golden ? "GOLDEN! +" : "+") + format(amount);
    el.style.left = x + "px";
    el.style.top = y + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), golden ? 1000 : 800);
  }

  function bumpScore() {
    scoreEl.classList.remove("bump");
    // force reflow so the animation restarts
    void scoreEl.offsetWidth;
    scoreEl.classList.add("bump");
  }

  function doClick(x, y) {
    // Combo: rapid clicks build a multiplier.
    const now = Date.now();
    if (now - lastClickTime < COMBO_WINDOW_MS) {
      combo = Math.min(COMBO_MAX, combo + 1);
    } else {
      combo = 1;
    }
    lastClickTime = now;
    const comboMult = 1 + combo * 0.02; // +2% per combo step

    let gain = perClick() * comboMult;
    const isGolden = Math.random() < GOLDEN_CHANCE;
    if (isGolden) {
      gain *= GOLDEN_MULTIPLIER;
      clickBtn.classList.add("golden");
      setTimeout(() => clickBtn.classList.remove("golden"), 400);
    }
    showFloat(gain, x, y, isGolden);
    state.score += gain;
    state.totalClicks++;
    addXp(Math.max(1, Math.floor(gain / 10)));
    bumpScore();
    checkMilestones();
    checkAchievements();
    save();
    render();
  }

  clickBtn.addEventListener("click", (e) => {
    doClick(e.clientX, e.clientY);
  });

  // Spacebar to click
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !switchPageEl.classList.contains("active")) {
      e.preventDefault();
      const rect = clickBtn.getBoundingClientRect();
      doClick(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }
  });

  resetBtn.addEventListener("click", () => {
    if (!confirm("Reset all progress?")) return;
    state = { score: 0, totalClicks: 0, owned: {}, rebirths: 0, pity: 0, mythicPity: 0, history: [], level: 1, xp: 0, luck: 0, achievements: {}, milestones: {} };
    save();
    render();
  });

  rebirthBtn.addEventListener("click", () => {
    if (!canRebirth()) return;
    if (!confirm("Rebirth? You'll lose your score and upgrades, but gain a permanent income boost.")) return;
    state.rebirths += 1;
    state.score = 0;
    state.owned = {};
    save();
    render();
  });

  function grantRandomUpgrade(copies) {
    const u = upgrades[Math.floor(Math.random() * upgrades.length)];
    state.owned[u.id] = (state.owned[u.id] || 0) + copies;
    return u;
  }

  // Applies a single roll's result to state and returns the result object.
  function applyRoll() {
    const rarity = rollRarity();
    const u = grantRandomUpgrade(rarity.copies);

    if (rarity.name === "Mythic") {
      state.mythicPity = 0;
      state.pity = 0;
    } else if (rarity.name === "Legendary") {
      state.pity = 0;
      state.mythicPity += 1;
    } else {
      state.pity += 1;
      state.mythicPity += 1;
    }

    const result = { rarity: rarity.name, name: u.name, copies: rarity.copies };
    state.history.unshift(result);
    if (state.history.length > 20) state.history.length = 20;
    return result;
  }

  function runRolls(count) {
    const results = [];
    for (let i = 0; i < count; i++) results.push(applyRoll());
    return results;
  }

  function showRollResults(results) {
    // Show the best result prominently, list all below.
    const order = { Mythic: 4, Legendary: 3, Epic: 2, Rare: 1, Common: 0 };
    const best = results.reduce((a, b) => (order[b.rarity] > order[a.rarity] ? b : a));
    let html =
      '<div class="big rarity-' + best.rarity + '">' + best.rarity + "!</div>" +
      '<div class="rarity-' + best.rarity + '">' + best.name + " x" + best.copies + "</div>";
    if (results.length > 1) {
      html += '<div style="font-size:0.75rem;color:#94a3b8;margin-top:6px;">' +
        results.map((r) => '<span class="rarity-' + r.rarity + '">' + r.rarity + "</span>").join(" \u00b7 ") +
        "</div>";
    }
    gachaResultEl.innerHTML = html;
  }

  switchBtn.addEventListener("click", () => {
    if (state.rebirths < SWITCH_REQUIRED_REBIRTHS) return;
    homePageEl.classList.add("hidden");
    switchPageEl.classList.add("active");
    renderGacha();
  });

  backBtn.addEventListener("click", () => {
    switchPageEl.classList.remove("active");
    homePageEl.classList.remove("hidden");
  });

  function startRoll(count) {
    if (switchLoading) return;
    const cost = gachaCost() * count;
    if (state.score < cost) return;

    state.score -= cost;
    switchLoading = true;
    switchProgress = 0;
    loadFillEl.style.width = "0%";
    gachaResultEl.innerHTML = "";
    switchLoadBtn.disabled = true;
    roll10Btn.disabled = true;
    render();

    const start = Date.now();
    switchTimer = setInterval(() => {
      const elapsed = Date.now() - start;
      switchProgress = Math.min(1, elapsed / SWITCH_LOAD_MS);
      loadFillEl.style.width = (switchProgress * 100).toFixed(1) + "%";

      if (switchProgress >= 1) {
        clearInterval(switchTimer);
        switchTimer = null;
        switchLoading = false;

        const results = runRolls(count);
        showRollResults(results);

        save();
        render();
      }
    }, 100);
  }

  switchLoadBtn.addEventListener("click", () => startRoll(1));
  roll10Btn.addEventListener("click", () => startRoll(10));

  luckBtn.addEventListener("click", () => {
    if (state.luck >= LUCK_MAX_LEVEL) return;
    const lc = luckCost();
    if (state.score < lc) return;
    state.score -= lc;
    state.luck += 1;
    save();
    render();
  });

  // Auto income tick
  setInterval(() => {
    const ps = perSecond();
    if (ps > 0) {
      state.score += ps;
      addXp(Math.max(1, Math.floor(ps / 10)));
      checkMilestones();
      checkAchievements();
      render();
    }
  }, 1000);

  // Combo decay: hide the combo meter when the window lapses.
  setInterval(() => {
    if (combo > 0 && Date.now() - lastClickTime >= COMBO_WINDOW_MS) {
      combo = 0;
      comboEl.classList.add("hidden");
    }
  }, 200);

  // Periodic save
  setInterval(save, 5000);

  load();
  buildShop();
  render();
</script>
</body>
</html>
